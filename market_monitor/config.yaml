name: Market Monitor
version: "0.6.0"
slug: market_monitor
description: >-
  Volgt grote transacties op de aandelen- en cryptomarkt (politici, insiders, bedrijven, walvissen),
  filtert het nieuws op betrouwbaarheid, maakt elk uur een samenvatting en geeft direct een noodmelding
  als er iets groots aan lijkt te komen, met een aanbeveling (long/short) en technische analyse.
  Optioneel: zelfstandig handelen via Bitvavo (crypto) en Trading 212 (aandelen), eerst met paper trading.
url: https://github.com/antoshkalol/Ai-programma-s-
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:finance
panel_title: Market Monitor
homeassistant_api: true
hassio_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Dashboard direct openen zonder Home Assistant (optioneel, bv. voor een aparte monitor)
options:
  sec_user_agent: ""
  notify_service: ""
  notify_summaries: true
  quiet_hours: ""
  notify_recommendation_changes: true
  alerts_enabled: true
  alert_sensitivity: normaal
  alert_critical: true
  ai_check_alerts: true
  max_alerts_per_day: 6
  anthropic_api_key: ""
  anthropic_model: claude-opus-5-5
  anthropic_effort: medium
  summary_language: nl
  summary_interval_minutes: 60
  enable_stocks: true
  stock_watchlist:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AVGO
    - JPM
    - ASML
  stock_news_queries:
    - stock market
    - earnings
    - insider buying
    - Federal Reserve
    - Wall Street
  stock_x_accounts:
    - elonmusk
    - realDonaldTrump
    - WhiteHouse
    - federalreserve
    - SECGov
    - Reuters
    - business
    - WSJmarkets
    - CNBC
    - DeItaone
  enable_sec_form4: true
  enable_house: true
  enable_senate: true
  quiver_api_key: ""
  stock_price_api_key: ""
  min_trade_value_usd: 100000
  big_trade_alert_usd: 1000000
  enable_crypto: true
  crypto_watchlist:
    - BTC
    - ETH
    - SOL
    - XRP
    - BNB
    - DOGE
    - ADA
    - LINK
    - AVAX
    - SUI
  crypto_news_queries:
    - bitcoin
    - ethereum
    - crypto market
    - crypto ETF
    - SEC crypto
  crypto_x_accounts:
    - saylor
    - VitalikButerin
    - brian_armstrong
    - cz_binance
    - EricBalchunas
    - coindesk
    - TheBlock__
    - tier10k
    - glassnode
    - WhaleAlert
  enable_crypto_treasury: true
  enable_btc_whales: true
  crypto_whale_min_usd: 50000000
  coingecko_api_key: ""
  enable_rss: true
  enable_google_news: true
  enable_gdelt: true
  extra_rss_feeds: []
  extra_crypto_rss_feeds: []
  trusted_domains: []
  blocked_domains: []
  min_news_credibility: 0.45
  x_bearer_token: ""
  allow_live_trading: false
  bitvavo_api_key: ""
  bitvavo_api_secret: ""
  trading212_api_key: ""
  trading212_api_secret: ""
  publish_to_home_assistant: true
  log_level: info
