configuration:
  sec_user_agent:
    name: SEC User-Agent (name + email)
    description: Required by the SEC, e.g. "Jane Doe jane@example.com". Only sent to sec.gov.
  notify_service:
    name: "Notifications: notify service of your phone"
    description: Empty = all phones with the Home Assistant app. Or e.g. mobile_app_janes_iphone (comma-separated).
  notify_summaries:
    name: "Notifications: hourly summary as popup"
  quiet_hours:
    name: "Notifications: quiet hours for the hourly summary (e.g. 23-7)"
  notify_recommendation_changes:
    name: "Notifications: popup when the recommendation changes"
  alerts_enabled:
    name: "Notifications: emergency alerts on"
  alert_sensitivity:
    name: "Notifications: sensitivity (laag = low, normaal = normal, hoog = high)"
  alert_critical:
    name: "Notifications: alerts break through silent/do not disturb"
  ai_check_alerts:
    name: "Notifications: let Claude check an alert first"
  max_alerts_per_day:
    name: "Notifications: max emergency alerts per day"
  anthropic_api_key:
    name: "AI: Anthropic API key (optional)"
  anthropic_model:
    name: "AI: Claude model"
    description: Default claude-opus-5-5 (best quality). claude-sonnet-5-5 or claude-haiku-5-5 cost much less.
  anthropic_effort:
    name: "AI: effort level"
  summary_language:
    name: "AI: summary language"
  summary_interval_minutes:
    name: Summary every ... minutes
  enable_stocks:
    name: "Stocks: enabled"
  stock_watchlist:
    name: "Stocks: watchlist"
  stock_news_queries:
    name: "Stocks: news search terms"
  stock_x_accounts:
    name: "Stocks: X accounts to follow"
  enable_sec_form4:
    name: "Stocks: SEC insiders (Form 4)"
  enable_house:
    name: "Stocks: US House"
  enable_senate:
    name: "Stocks: US Senate"
  quiver_api_key:
    name: "Stocks: Quiver Quantitative API key (optional, paid)"
  stock_price_api_key:
    name: "Stocks: Twelve Data API key for prices (optional, free)"
  min_trade_value_usd:
    name: Minimum trade size (USD)
  big_trade_alert_usd:
    name: Big trade event threshold (USD)
  enable_crypto:
    name: "Crypto: enabled"
  crypto_watchlist:
    name: "Crypto: watchlist (symbols)"
  crypto_news_queries:
    name: "Crypto: news search terms"
  crypto_x_accounts:
    name: "Crypto: X accounts to follow"
  enable_crypto_treasury:
    name: "Crypto: company purchases via SEC 8-K"
  enable_btc_whales:
    name: "Crypto: large bitcoin transfers (whales)"
  crypto_whale_min_usd:
    name: "Crypto: minimum whale transfer (USD)"
  coingecko_api_key:
    name: "Crypto: CoinGecko demo key (optional, free)"
  enable_rss:
    name: "News: RSS feeds of trusted media"
  enable_google_news:
    name: "News: Google News"
  enable_gdelt:
    name: "News: GDELT (global news)"
  extra_rss_feeds:
    name: "News: extra RSS feeds (stocks)"
  extra_crypto_rss_feeds:
    name: "News: extra RSS feeds (crypto)"
  trusted_domains:
    name: "News: trusted domains"
  blocked_domains:
    name: "News: blocked domains"
  min_news_credibility:
    name: "News: minimum credibility (0-1)"
  x_bearer_token:
    name: X (Twitter) bearer token (optional, paid)
  allow_live_trading:
    name: "Trading: allow live trading with real money"
    description: >-
      Master switch. Off = paper trading only. On = you can start a live run in the Trading tab. Always start with
      a dry run and small amounts.
  bitvavo_api_key:
    name: "Trading: Bitvavo API key"
    description: Grant only 'View' and 'Trade' permissions, NEVER 'Withdraw'. Enable an IP whitelist.
  bitvavo_api_secret:
    name: "Trading: Bitvavo API secret"
  trading212_api_key:
    name: "Trading: Trading 212 API key"
    description: >-
      Trading 212 > Settings > API (beta), Invest account only. Create it in the environment you select (demo or
      live) in the Trading tab. Enable an IP restriction.
  trading212_api_secret:
    name: "Trading: Trading 212 API secret"
    description: New keys come with a secret. Leave empty for an old key without a secret.
  publish_to_home_assistant:
    name: Publish sensors to Home Assistant
  log_level:
    name: Log level
network:
  8099/tcp: Open the dashboard directly without Home Assistant (optional)
